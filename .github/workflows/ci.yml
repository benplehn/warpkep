name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install CMake
        run: python -m pip install cmake

      - name: Configure C++ build
        run: |
          cmake -S . -B build/cpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DWARPKEP_BUILD_PYTHON=OFF \
            -DWARPKEP_ENABLE_CUDA=OFF

      - name: Build C++ library
        run: cmake --build build/cpu --parallel 2

      - name: Run C++ executable
        run: ./build/cpu/warpkep_smoke

      - name: Build and install Python package
        run: python -m pip install .

      - name: Check Python import and version
        run: |
          python - <<'PY'
          import warpkep
          from importlib.metadata import version

          reported = warpkep.version()
          installed = version("warpkep")

          assert reported == installed, (reported, installed)
          print(f"warpkep {reported}")
          PY

  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build CUDA development image
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile.cuda \
            -t warpkep-cuda:ci \
            docker

      - name: Compile CUDA target
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            warpkep-cuda:ci \
            bash -c '
              set -e
              cmake -S . -B build/cuda-ci -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DWARPKEP_ENABLE_CUDA=ON \
                -DWARPKEP_BUILD_PYTHON=OFF \
                -DCMAKE_CUDA_ARCHITECTURES=80
              cmake --build build/cuda-ci \
                --target warpkep_cuda_compile_smoke \
                --parallel 2
            '

  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build reference environment
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile.references \
            -t warpkep-references:ci \
            docker

      - name: Check reference propagators
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace:ro" \
            -w /workspace \
            warpkep-references:ci \
            python validation/reference_smoke.py