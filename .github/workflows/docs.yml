name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: python -m sphinx -n -W --keep-going -b html docs build/docs

      - name: Compile and run the documented Lambert example
        run: |
          mkdir -p build/examples
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic -I include \
            examples/lambert_multi_rev.cpp -o build/examples/lambert_multi_rev
          ./build/examples/lambert_multi_rev

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: warpkep-docs
          path: build/docs/
          retention-days: 14
