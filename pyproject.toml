[build-system]
requires = [
    "scikit-build-core>=0.11,<2",
    "nanobind>=3.1,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "warpkep"
version = "0.1.0.dev0"
description = "Orbital propagation and trajectory search in batches"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["python/warpkep"]

[tool.scikit-build.cmake.define]
WARPKEP_BUILD_PYTHON = "ON"